<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bulb On / Off</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<style>
        .display{
        margin-top: 150px;
    }
    @media screen and (max-width: 768px) {
        margin-top:280px;
    }
</style>
</head>
<body class="bg-black">
    <h1 class="text-center text-primary mt-5">Click the Bulb</h1>
    <div class="d-flex justify-content-center mb-3 display">
    <img id="bulb" src="img/off.png" alt="no img" width="200px">
        </div>
        <div class="d-flex justify-content-center">
    <button onclick="change()"  id="btn" class="btn btn-danger mx-5">Switch</button>
</div>
     
</body>
<script>
    function change(){
        let off=document.getElementById("bulb")
        let b=document.getElementById("btn")
        
        off.src=(off.src.includes("off.png"))?"img/on.png":"img/off.png";
           b.className=(b.className=="btn btn-danger mx-5")?"btn btn-success mx-5":"btn btn-danger mx-5"
    
    }
    
   
</script>
</html>
